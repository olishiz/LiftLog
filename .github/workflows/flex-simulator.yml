name: Flex monochrome simulator

on:
  push:
    branches:
      - cursor/flex-monochrome-preview-130b

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: brandonp2412/Flex
          ref: main
          path: flex
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Install the Flutter SDK Flex pins
        working-directory: flex
        run: |
          git submodule update --init --recursive flutter
          # A shallow checkout has no release tags, so Flutter would report
          # version 0.0.0 and fail the SDK constraint. This commit is the
          # 3.47 candidate Flex pins.
          git -C flutter tag -f 3.47.0
          ./flutter/bin/flutter config --no-analytics
          ./flutter/bin/flutter --version
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"

      - name: Switch the theme to black and white
        run: python3 scripts/monochrome_flex.py flex

      - name: Get dependencies
        working-directory: flex
        run: flutter pub get --enforce-lockfile

      - name: Build the iOS simulator app
        working-directory: flex
        run: flutter build ios --simulator

      - name: Package Runner.app
        working-directory: flex
        run: tar -czf "$GITHUB_WORKSPACE/Runner.app.tar.gz" -C build/ios/iphonesimulator Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: flex-simulator-app
          path: Runner.app.tar.gz
          retention-days: 1
