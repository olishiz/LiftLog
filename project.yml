name: LiftLog

options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  projectFormat: xcode15_0
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - LiftLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olishiz.liftlog
        PRODUCT_NAME: LiftLog
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LiftLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  LiftLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LiftLogTests
    dependencies:
      - target: LiftLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olishiz.liftlogtests
        PRODUCT_NAME: LiftLogTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LiftLog:
    build:
      targets:
        LiftLog: all
        LiftLogTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftLogTests
    archive:
      config: Release
